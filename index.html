<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agygyimot event - 2044.10.21.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="overlay">
    <h1 class="title">agygyimot event</h1>
    <p class="event-date">2044.10.21.</p>

    <section class="countdown" id="countdown" aria-live="polite">
      <div class="unit">
        <span class="value" id="years">0</span>
        <span class="label">év</span>
      </div>
      <div class="unit">
        <span class="value" id="months">0</span>
        <span class="label">hónap</span>
      </div>
      <div class="unit">
        <span class="value" id="days">0</span>
        <span class="label">nap</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">0</span>
        <span class="label">óra</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">0</span>
        <span class="label">perc</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">0</span>
        <span class="label">másodperc</span>
      </div>
    </section>

    <p class="finished" id="finished" hidden>Az esemény elkezdődött!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
